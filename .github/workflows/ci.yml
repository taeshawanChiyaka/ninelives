name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/ninelives
      - run: pytest -q tests/test_core.py::test_process_resumable_map_preserves_order
      - run: pytest -q
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.13'
      - run: pytest --cov=ninelives --cov-branch --cov-fail-under=90
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
