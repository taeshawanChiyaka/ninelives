[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ninelives"
version = "0.1.0"
description = "Crash-resilient, resumable Python computation with explainable cache invalidation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Takudzwa Chiyaka"}]
keywords = ["cache", "checkpoint", "resumable", "memoization", "ml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "mypy>=1.10", "ruff>=0.5", "build>=1", "twine>=5", "pytest-benchmark>=4"]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2"]
torch = ["torch"]
tqdm = ["tqdm"]
all = ["numpy>=1.24", "pandas>=2", "torch", "tqdm"]

[project.scripts]
ninelives = "ninelives.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ninelives"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
